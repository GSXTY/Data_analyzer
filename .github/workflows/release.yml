name: Windows trial release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from app_version import APP_VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v' + APP_VERSION
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run browser logic tests
        run: |
          node tests/test_annotations.cjs
          node tests/test_interaction.cjs
      - name: Build portable Windows package
        run: python build_windows.py
      - name: Verify standalone package
        run: python tests/package_smoke.py dist/RespiratoryViewer/RespiratoryViewer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-trial
          path: release/*
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/* --title "Respiratory Viewer $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
